/* Browser notification toggle */
.notif-settings{border-top:1px solid #f0eeff;padding:10px 12px}

  {id:'other',l:'อื่นๆ',e:'📌',dot:'#64748B',light:'#F1F5F9',tc:'#334155'},
]
const DOWS=['อา','จ','อ','พ','พฤ','ศ','ส']
const KEY='planify-2026'
let data=MONTHS.map(()=>[])
let cur=new Date().getMonth()
let selCat='work',calSelCat='work',selDay=null,activeTab='checklist',editIdx=null,editModalCat='work'
const TODAY=new Date()
function daysInMonth(m){return new Date(2026,m+1,0).getDate()}
function firstDOW(m){return new Date(2026,m,1).getDay()}
function loadData(){try{const s=localStorage.getItem(KEY);if(s){const p=JSON.parse(s);if(Array.isArray(p)&&p.length===12)data=p}}catch(e){}}
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwTclBkCNQxeFaPhzQAbRoXCLmcpq1uqdDI9pdvLQ_fzZBaxHApd4RYqNCvCzEnjSl2pA/exec'

function saveData(){
  try{
    localStorage.setItem(KEY,JSON.stringify(data))
    showToast('บันทึกแล้ว')
  }catch(e){}
  // ส่งข้อมูลไป Google Sheets
  try{
    fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    })
  }catch(e){}
}
let toastT=null
function showToast(msg){const t=document.getElementById('toast');document.getElementById('toast-msg').textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2000)}
function clearAll(){if(!confirm('ล้างข้อมูลทั้งหมด?'))return;data=MONTHS.map(()=>[]);localStorage.removeItem(KEY);selDay=null;render()}
function pct(mi){const d=data[mi];if(!d.length)return 0;return Math.round(d.filter(x=>x.done).length/d.length*100)}
function catPillsHTML(ac,fn){return CATS.map(c=>`<div class="cpill${ac===c.id?' on':''}" style="${ac===c.id?`background:${c.light};border-color:${c.dot};color:${c.tc}`:''}" onclick="${fn}('${c.id}')"><div class="cpill-icon" style="background:${c.light}">${c.e}</div><span class="cpill-label">${c.l}</span></div>`).join('')}
function renderHero(){
  const all=data.flat(),done=all.filter(x=>x.done).length,total=all.length,p=total?Math.round(done/total*100):0
  document.getElementById('h-total').textContent=total
  document.getElementById('h-done').textContent=done
  document.getElementById('h-left').textContent=total-done
  const arc=document.getElementById('big-arc'),c=131.9
  arc.style.strokeDashoffset=c-(c*p/100)
  document.getElementById('big-pct').textContent=p+'%'
  document.getElementById('hero-prog-fill').style.width=p+'%'
}
function renderGrid(){
  document.getElementById('cur-mon-label').textContent=MONTHS[cur].f
  document.getElementById('mgrid').innerHTML=MONTHS.map((m,i)=>{const d=data[i],p=pct(i),done=d.filter(x=>x.done).length;return`<div class="mc${i===cur?' sel':''}" onclick="selectMonth(${i})"><div class="mc-bar" style="background:${i===cur?m.h:'#e8e6ff'}"></div><div class="mc-name">${m.s}</div><div class="mc-count">${done}/${d.length}</div><div class="mc-pct" style="color:${m.h}">${p}%</div></div>`}).join('')
}
function renderPanelHead(){
  const m=MONTHS[cur],d=data[cur],done=d.filter(x=>x.done).length,p=pct(cur)
  const icon=document.getElementById('ph-icon');icon.style.background=m.light;icon.textContent=m.e
  document.getElementById('ph-name').textContent=m.f
  document.getElementById('ph-sub').textContent=`${d.length} รายการ · เสร็จ ${done}`
  const badge=document.getElementById('ph-badge');badge.textContent=p+'%';badge.style.background=m.light;badge.style.color=m.tc
  document.getElementById('prog-fill').style.width=p+'%';document.getElementById('prog-fill').style.background=m.h
}
function itemHTML(x,j,showDay=true){
  const cat=CATS.find(c=>c.id===x.cat)||CATS[4]
  return `<div class="it${x.done?' done':''}"><div class="chk${x.done?' on':''}" onclick="toggle(${j})">${x.done?'✓':''}</div><div class="it-emoji" style="background:${cat.light}">${cat.e}</div><span class="it-tx">${x.text}</span>${showDay&&x.day?`<span class="it-date">📅 ${x.day}</span>`:''}<div class="it-actions"><button class="act-btn edit" onclick="openEdit(${j})">✏️</button><button class="act-btn del" onclick="openEdit(${j},true)">🗑</button></div></div>`
}
function renderChecklist(){
  const d=data[cur],done=d.filter(x=>x.done).length,rem=d.length-done
  document.getElementById('stat3').innerHTML=`<div class="sc" style="background:#f5f4ff"><div class="sc-n">${d.length}</div><div class="sc-l" style="color:#6E6B7B">ทั้งหมด</div></div><div class="sc" style="background:#ECFDF5"><div class="sc-n" style="color:#059669">${done}</div><div class="sc-l" style="color:#059669">เสร็จ</div></div><div class="sc" style="background:#FEF2F2"><div class="sc-n" style="color:#DC2626">${rem}</div><div class="sc-l" style="color:#DC2626">ค้างอยู่</div></div>`
  document.getElementById('cpills').innerHTML=catPillsHTML(selCat,'setSelCat')
  const list=document.getElementById('ilist')
  if(!d.length){list.innerHTML=`<div class="empty"><div style="font-size:32px">${MONTHS[cur].e}</div><p>ยังไม่มีรายการ</p></div>`;return}
  list.innerHTML=d.map((x,j)=>itemHTML(x,j,true)).join('')
}
function renderCalendar(){
  const days=daysInMonth(cur),first=firstDOW(cur)
  document.getElementById('cal-header').innerHTML=DOWS.map((d,i)=>`<div class="cal-dow${i===0||i===6?' we':''}">${d}</div>`).join('')
  const cells=[]
  for(let i=0;i<first;i++)cells.push('<div class="cal-day empty"></div>')
  for(let d=1;d<=days;d++){
    const isToday=TODAY.getFullYear()===2026&&TODAY.getMonth()===cur&&TODAY.getDate()===d
    const dayItems=data[cur].filter(x=>x.day===d)
    const dots=dayItems.slice(0,4).map(x=>{const c=CATS.find(cc=>cc.id===x.cat)||CATS[4];return`<div class="day-dot" style="background:${x.done?'#10B981':c.dot}"></div>`}).join('')
    cells.push(`<div class="cal-day${isToday?' today':''}${selDay===d?' selected':''}" onclick="selectDay(${d})"><div class="day-num">${d}</div>${dots?`<div class="day-dots">${dots}</div>`:''}</div>`)
  }
  document.getElementById('cal-grid').innerHTML=cells.join('')
  document.getElementById('cal-cpills').innerHTML=catPillsHTML(calSelCat,'setCalCat')
  renderDayPanel()
}
function renderDayPanel(){
  const panel=document.getElementById('day-panel')
  if(!selDay){panel.innerHTML='';return}
  const m=MONTHS[cur],dayItems=data[cur].map((x,j)=>({x,j})).filter(({x})=>x.day===selDay)
  panel.innerHTML=`<div class="day-tasks"><div class="day-tasks-head"><span class="day-tasks-title">📅 วันที่ ${selDay} ${m.f}</span><span class="day-tasks-badge">${dayItems.length} รายการ</span></div>${dayItems.length?dayItems.map(({x,j})=>itemHTML(x,j,false)).join(''):'<div style="font-size:12px;color:#9CA3AF;text-align:center;padding:8px 0">ไม่มีรายการ</div>'}</div>`
  document.getElementById('cal-inp').placeholder=`เพิ่มรายการวันที่ ${selDay} ${m.f}...`
}
function openEdit(j,focusDel=false){
  editIdx=j;const x=data[cur][j];editModalCat=x.cat||'work'
  document.getElementById('modal-text').value=x.text
  document.getElementById('modal-day').value=x.day||''
  document.getElementById('modal-title').textContent=focusDel?'ลบรายการ':'แก้ไขรายการ'
  renderModalCats();document.getElementById('modal').style.display='flex'
  if(!focusDel)setTimeout(()=>document.getElementById('modal-text').focus(),50)
}
function renderModalCats(){document.getElementById('modal-cats').innerHTML=CATS.map(c=>`<div class="modal-cat-item${editModalCat===c.id?' on':''}" style="${editModalCat===c.id?`border-color:${c.dot};background:${c.light}`:''}" onclick="editModalCat='${c.id}';renderModalCats()"><div class="mci-emoji" style="background:${c.light}">${c.e}</div><span class="mci-label" style="color:${editModalCat===c.id?c.tc:'#6E6B7B'}">${c.l}</span></div>`).join('')}
function closeModal(){document.getElementById('modal').style.display='none';editIdx=null}
function saveEdit(){
  if(editIdx===null)return
  const txt=document.getElementById('modal-text').value.trim()
  if(!txt){document.getElementById('modal-text').focus();return}
  const dayVal=parseInt(document.getElementById('modal-day').value)||null
  data[cur][editIdx]={...data[cur][editIdx],text:txt,cat:editModalCat,day:dayVal}
  closeModal();render();showToast('แก้ไขแล้ว')
}
function confirmDelete(){
  if(editIdx===null)return
  data[cur].splice(editIdx,1)
  if(selDay&&!data[cur].some(x=>x.day===selDay))selDay=null
  closeModal();render();showToast('ลบแล้ว')
}
function setSelCat(id){selCat=id;renderChecklist()}
function setCalCat(id){calSelCat=id;renderCalendar()}
function switchTab(tab,el){activeTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');document.getElementById('view-checklist').style.display=tab==='checklist'?'block':'none';document.getElementById('view-calendar').style.display=tab==='calendar'?'block':'none';if(tab==='calendar')renderCalendar()}
function render(){saveData();renderHero();renderGrid();renderPanelHead();if(activeTab==='checklist')renderChecklist();else renderCalendar();renderRemindPanel()}
function selectMonth(i){cur=i;selDay=null;renderGrid();renderPanelHead();if(activeTab==='checklist')renderChecklist();else renderCalendar()}
function selectDay(d){selDay=selDay===d?null:d;renderCalendar()}
function toggle(j){data[cur][j].done=!data[cur][j].done;render()}
function addItem(){const inp=document.getElementById('inp'),t=inp.value.trim();if(!t)return;data[cur].push({text:t,cat:selCat,done:false,day:null});inp.value='';render()}
function addCalItem(){const inp=document.getElementById('cal-inp'),t=inp.value.trim();if(!t)return;data[cur].push({text:t,cat:calSelCat,done:false,day:selDay});inp.value='';render()}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter')addItem()})
document.getElementById('cal-inp').addEventListener('keydown',e=>{if(e.key==='Enter')addCalItem()})
document.getElementById('modal-text').addEventListener('keydown',e=>{if(e.key==='Enter')saveEdit()})
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))closeModal()})
// ===== REMINDER SYSTEM =====
let remindPanelOpen = false

function getReminders() {
  const todayM = TODAY.getMonth()
  const todayD = TODAY.getDate()
  const results = []
  MONTHS.forEach((m, mi) => {
    data[mi].forEach((x, j) => {
      if (x.done || !x.day) return
      const diff = (mi - todayM) * 31 + (x.day - todayD) // rough diff in days
      let type = null
      if (mi < todayM || (mi === todayM && x.day < todayD)) type = 'overdue'
      else if (mi === todayM && x.day === todayD) type = 'today'
      else if (mi === todayM && x.day - todayD <= 3) type = 'soon'
      if (type) results.push({ x, mi, j, type, m })
    })
  })
  // sort: overdue first, then today, then soon
  const order = { overdue: 0, today: 1, soon: 2 }
  results.sort((a, b) => order[a.type] - order[b.type] || a.mi - b.mi || a.x.day - b.x.day)
  return results
}

function renderRemindPanel() {
  const items = getReminders()
  const badge = document.getElementById('remind-badge')
  const body = document.getElementById('rp-body')
  if (items.length) {
    badge.textContent = items.length > 9 ? '9+' : items.length
    badge.classList.add('show')
  } else {
    badge.classList.remove('show')
  }
  if (!items.length) {
    body.innerHTML = '<div class="rp-empty">🎉<br>ไม่มีรายการค้างอยู่</div>'
    return
  }
  const tagLabel = { overdue: 'เลยกำหนด', today: 'วันนี้', soon: 'เร็วๆ นี้' }
  body.innerHTML = items.map(({ x, mi, j, type, m }) => {
    const cat = CATS.find(c => c.id === x.cat) || CATS[4]
    const dateStr = `${x.day} ${m.f}`
    return `<div class="rp-item ${type}" onclick="jumpToItem(${mi},${j})">
      <div class="rp-dot"></div>
      <div class="rp-info">
        <div class="rp-text">${cat.e} ${x.text}</div>
        <div class="rp-meta">📅 ${dateStr}</div>
      </div>
      <div class="rp-tag">${tagLabel[type]}</div>
    </div>`
  }).join('')
}

function toggleRemindPanel() {
  remindPanelOpen = !remindPanelOpen
  document.getElementById('remind-panel').classList.toggle('show', remindPanelOpen)
  if (remindPanelOpen) renderRemindPanel()
}

function jumpToItem(mi, j) {
  toggleRemindPanel()
  selectMonth(mi)
  activeTab = 'checklist'
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'))
  document.querySelectorAll('.tab')[0].classList.add('on')
  document.getElementById('view-checklist').style.display = 'block'
  document.getElementById('view-calendar').style.display = 'none'
  renderChecklist()
  setTimeout(() => {
    const items = document.querySelectorAll('.it')
    if (items[j]) items[j].scrollIntoView({ behavior: 'smooth', block: 'center' })
  }, 100)
}

// ===== SMART SCHEDULE SYSTEM =====
// Mode A: after work = 17:00–17:30  |  Mode B: random within today before 17:30
let notifMode = localStorage.getItem('notif-mode') || 'random' // 'afterwork' | 'random'
let notifEnabled = localStorage.getItem('notif-enabled') === '1'
let scheduledTimers = []

function saveNotifPrefs() {
  localStorage.setItem('notif-mode', notifMode)
  localStorage.setItem('notif-enabled', notifEnabled ? '1' : '0')
}

function toggleBrowserNotif(on) {
  if (!on) {
    notifEnabled = false
    saveNotifPrefs()
    clearAllTimers()
    showToast('ปิดการแจ้งเตือนแล้ว')
    return
  }
  if (!('Notification' in window)) {
    document.getElementById('notif-check').checked = false
    showToast('เบราว์เซอร์ไม่รองรับ')
    return
  }
  Notification.requestPermission().then(perm => {
    if (perm === 'granted') {
      notifEnabled = true
      saveNotifPrefs()
      scheduleToday()
      showToast('เปิดการแจ้งเตือนแล้ว 🔔')
      renderNotifSettings()
    } else {
      document.getElementById('notif-check').checked = false
      showToast('กรุณาอนุญาต notification ในเบราว์เซอร์')
    }
  })
}

function setNotifMode(mode) {
  notifMode = mode
  saveNotifPrefs()
  clearAllTimers()
  if (notifEnabled) scheduleToday()
  renderNotifSettings()
  showToast(mode === 'afterwork' ? '⏰ แจ้งเตือนหลังเลิกงาน 17:00' : '🎲 สุ่มเวลาแจ้งเตือน')
}

function clearAllTimers() {
  scheduledTimers.forEach(t => clearTimeout(t))
  scheduledTimers = []
}

function scheduleToday() {
  clearAllTimers()
  const now = new Date()
  const cutoff = new Date(now); cutoff.setHours(17,30,0,0)
  if (now >= cutoff) return // past 17:30 today, nothing to do

  let fireTime
  if (notifMode === 'afterwork') {
    // fire at 17:00 (or now+10s if already past 17:00)
    const at17 = new Date(now); at17.setHours(17,0,0,0)
    fireTime = at17 > now ? at17 : new Date(now.getTime() + 10000)
    if (fireTime >= cutoff) fireTime = new Date(cutoff.getTime() - 60000) // 17:29
  } else {
    // random between now+1min and 17:30
    const earliest = now.getTime() + 60000
    const latest = cutoff.getTime()
    if (earliest >= latest) { fireTime = new Date(now.getTime() + 10000) }
    else { fireTime = new Date(earliest + Math.random() * (latest - earliest)) }
  }

  const delay = fireTime - now
  const t = setTimeout(() => fireNotification(), delay)
  scheduledTimers.push(t)

  // schedule midnight reset for tomorrow
  const midnight = new Date(now); midnight.setHours(24,0,5,0)
  const t2 = setTimeout(() => { if(notifEnabled) scheduleToday() }, midnight - now)
  scheduledTimers.push(t2)
}

function fireNotification() {
  if (Notification.permission !== 'granted') return
  const items = getReminders()
  const urgent = items.filter(r => r.type === 'overdue' || r.type === 'today')
  if (!urgent.length) return

  const msgs = [
    'อย่าลืมทำสิ่งที่ค้างอยู่วันนี้นะ! 💪',
    'ยังมีงานรอคุณอยู่เลย อย่าลืมนะ 😊',
    'เช็กรายการวันนี้ก่อนเลิกงานเลย! ✅',
    'อย่าให้งานค้างข้ามวันนะ — ทำเดี๋ยวนี้เลย! 🚀',
    'หมดวันแล้ว ยังมีรายการที่ต้องทำอีกนะ 📋',
  ]
  const randomMsg = msgs[Math.floor(Math.random() * msgs.length)]

  // build body listing up to 3 items
  const preview = urgent.slice(0,3).map(r => `• ${r.x.text}`).join('\n')
  const extra = urgent.length > 3 ? `\n+อีก ${urgent.length-3} รายการ` : ''

  const n = new Notification('🔔 อย่าลืม! มีรายการค้างอยู่', {
    body: randomMsg + '\n' + preview + extra,
    icon: '',
    badge: '',
    tag: 'planify-daily',
    requireInteraction: true
  })
  n.onclick = () => { window.focus(); toggleRemindPanel(); n.close() }
}

function renderNotifSettings() {
  const el = document.getElementById('notif-settings')
  if (!el) return
  const hint = notifMode === 'afterwork'
    ? '⏰ แจ้งเตือนเวลา 17:00 น.'
    : '🎲 สุ่มเวลาแจ้งเตือน ก่อน 17:30 น.'
  el.innerHTML = `
    <div class="ns-row">
      <label class="ns-toggle">
        <input type="checkbox" id="notif-check" ${notifEnabled?'checked':''} onchange="toggleBrowserNotif(this.checked)">
        <div class="ns-slider"></div>
      </label>
      <span class="ns-label">แจ้งเตือนรายการค้างวันนี้</span>
    </div>
    ${notifEnabled ? `
    <div class="ns-modes">
      <button class="ns-mode-btn ${notifMode==='afterwork'?'on':''}" onclick="setNotifMode('afterwork')">⏰ หลังเลิกงาน<br><span style="font-weight:500;font-size:9px">17:00 น.</span></button>
      <button class="ns-mode-btn ${notifMode==='random'?'on':''}" onclick="setNotifMode('random')">🎲 สุ่มเวลา<br><span style="font-weight:500;font-size:9px">ก่อน 17:30</span></button>
    </div>
    <div class="ns-time-hint">${hint}</div>
    ` : ''}
  `
}

// Close panel when clicking outside
document.addEventListener('click', e => {
  const panel = document.getElementById('remind-panel')
  const bell = document.querySelector('.remind-bell')
  if (remindPanelOpen && !panel.contains(e.target) && !bell.contains(e.target)) {
    remindPanelOpen = false
    panel.classList.remove('show')
  }
})

loadData();render()
renderRemindPanel()
renderNotifSettings()
// restore scheduled notifications if was enabled
if (notifEnabled && Notification.permission === 'granted') scheduleToday()
